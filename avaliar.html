<style>
/* Link enviado no dia seguinte à visita: avaliar.html?r=<reserva>&t=<token>  ou  avaliar.html?f=<senha da fila> */
:root{
  color-scheme:dark;
  --bg:#121212; --panel:#1b1b1d; --panel2:#242427; --line:#2f2f34; --ink:#f4f1ec; --muted:#9c978f;
  --red:#e8323a; --red-d:#c4232b; --orange:#f28a30; --yellow:#ffe81a; --blue:#0a74b8; --green:#3fbf74; --green-d:#1f8a4c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;border-top:3px solid var(--red);min-height:100vh}
.hero{text-align:center;padding:22px 16px 64px;background:radial-gradient(circle at 50% -40%,#e8323a55,transparent 65%)}
.hero img{width:96px;height:96px;display:block;margin:0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.hero h1{font:800 25px/1.1 'Baloo 2',sans-serif;margin:8px 0 0}
.hero p{margin:4px 0 0;font-size:14px;color:var(--muted)}
main{max-width:520px;margin:-46px auto 30px;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.45);padding:22px 18px}
.perg{font:700 18px/1.3 'Baloo 2',sans-serif;margin:0 0 10px}
.perg small{display:block;font:500 13px Inter;color:var(--muted);margin-top:2px}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps button{aspect-ratio:1/1.15;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;font:800 16px Inter;cursor:pointer;padding:0}
.nps button.d{border-bottom:3px solid #ef5a4f}.nps button.n{border-bottom:3px solid #f2b632}.nps button.p{border-bottom:3px solid var(--green)}
.nps button.on{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow)}
.escala{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.bloco{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.crit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.crit span{font-weight:600}
.estrelas{display:flex;gap:4px}
.estrelas button{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;padding:2px;filter:grayscale(1) opacity(.35);transition:transform .1s}
.estrelas button.on{filter:none}
.estrelas button:active{transform:scale(1.2)}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);margin-top:6px}
input:focus,textarea:focus{outline:none;border-color:var(--orange)}
::placeholder{color:#6f6b66}
textarea{min-height:80px;resize:vertical}
label{display:block;font-weight:600;margin-top:14px}
label small{color:var(--muted);font-weight:500}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:800 19px 'Baloo 2',sans-serif;cursor:pointer;margin-top:20px;background:var(--red);color:#fff;text-align:center;text-decoration:none;box-shadow:0 6px 0 var(--red-d)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.google{background:#fff;color:#1a1a1a;box-shadow:0 6px 0 #bdbdbd;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.claro{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none;font:600 15px Inter;padding:13px}
.erro{background:#3a1c1c;border:1px solid #5a2320;color:#ffb3ad;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px;display:none}
.fim{text-align:center}
.fim .icone{font-size:58px}
.fim h2{font:800 28px/1.1 'Baloo 2',sans-serif;margin:6px 0}
.fim p{color:var(--muted);margin:6px 0}
.g{width:22px;height:22px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
.demo{background:#3a2a10;color:var(--yellow);text-align:center;font-size:12px;padding:6px}
.hidden{display:none!important}
</style>
</head>

const CRITS=[['atendimento','Atendimento'],['comida','Comida e buffet'],['sabor','Sabor das pizzas'],['ambiente','Ambiente e limpeza']];
const resp={nps:null};
const G='<svg class="g" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

function erro(m){const e=$('erro');e.textContent=m||'';e.style.display=m?'block':'none'}

async function iniciar(){
  if(!API_URL)$('demo').classList.remove('hidden');
  $('nps').innerHTML=Array.from({length:11},(_,i)=>`<button type="button" data-n="${i}" class="${i<=6?'d':i<=8?'n':'p'}">${i}</button>`).join('');
  $('crits').innerHTML=CRITS.map(([k,n])=>`<div class="crit"><span>${n}</span><div class="estrelas" data-k="${k}">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" aria-label="${v} estrela${v>1?'s':''}">⭐</button>`).join('')}</div></div>`).join('');
  if(!chave.f&&!(chave.r&&chave.t)){mostrarFim('🔗','Link incompleto','Abra o link exatamente como recebeu no WhatsApp.');return}
  try{
    const v=await apiGet(Object.assign({action:'avaliacao'},chave));
    $('titulo').textContent='Olá, '+v.nome+'! Como foi a sua visita?';
    $('sub').textContent='Dina Pizza '+v.loja+' · leva menos de 1 minuto 💛';
    if(v.ja_respondeu)fimObrigado({tipo:v.nps>=9?'promotor':v.nps>=7?'neutro':'detrator',link_google:v.link_google,loja:v.loja},true);
  }catch(e){mostrarFim('🔗','Não encontramos a sua visita',e.message)}
}

function mostrarFim(icone,titulo,texto,extra){
  $('cForm').classList.add('hidden');$('cFim').classList.remove('hidden');
  $('cFim').innerHTML=`<div class="icone">${icone}</div><h2>${esc(titulo)}</h2><p>${texto}</p>${extra||''}`;
}

function fimObrigado(r,jaTinha){
  const g=r.link_google?`<a class="btn google" id="btGoogle" href="${esc(r.link_google)}" target="_blank" rel="noopener">${G} Avaliar no Google</a>`:'';
  if(r.tipo==='promotor')
    mostrarFim('🍕','Que bom que você gostou!',`Obrigado por avaliar a Dina Pizza ${esc(r.loja)}. Pode deixar a sua avaliação também no Google? Leva 30 segundos e ajuda muito outras famílias a conhecerem a gente. 💛`,g);
  else if(r.tipo==='neutro')
    mostrarFim('💛','Obrigado pela avaliação!','A sua opinião ajuda a gente a melhorar a cada visita.'+(g?' Se quiser, conte também no Google:':''),g);
  else
    mostrarFim('🙏','Obrigado por nos contar','Sentimos muito que a experiência não foi como esperado. A gerência da unidade vai ler a sua avaliação e pode entrar em contato com você.'+(r.link_google?' Se preferir, você também pode avaliar no Google.':''),r.link_google?g.replace('class="btn google"','class="btn claro"'):'');
  if(jaTinha)$('sub').textContent='Você já avaliou esta visita. Obrigado!';
  const b=$('btGoogle');if(b&&r.id)b.addEventListener('click',()=>{apiPost({action:'avaliacaoGoogle',id:r.id}).catch(()=>{})});
}

async function enviar(){
  erro('');
  if(resp.nps==null)return erro('Escolha uma nota de 0 a 10.');
  const b=$('enviar');b.disabled=true;b.textContent='Enviando…';
  try{
    const r=await apiPost(Object.assign({action:'avaliar',nps:resp.nps,pizza_favorita:$('pizza').value.trim(),comentario:$('coment').value.trim()},
      Object.fromEntries(CRITS.map(([k])=>[k,resp[k]||''])),chave));
    window.scrollTo({top:0,behavior:'smooth'});fimObrigado(r);
  }catch(e){erro(e.message);b.disabled=false;b.textContent='Enviar avaliação'}
}

$('nps').onclick=e=>{const b=e.target.closest('button');if(!b)return;resp.nps=+b.dataset.n;document.querySelectorAll('#nps button').forEach(x=>x.classList.toggle('on',x===b));$('enviar').disabled=false;
  $('coment').placeholder=resp.nps<=6?'O que não foi legal? Queremos resolver.':resp.nps<=8?'O que faltou para ser nota 10?':'O que você mais gostou?'};
$('crits').onclick=e=>{const b=e.target.closest('button');if(!b)return;const box=b.parentNode,v=+b.dataset.v;resp[box.dataset.k]=v;box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=v))};
$('enviar').onclick=enviar;
iniciar();
</script>
</body>
</html>

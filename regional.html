<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>if(location.protocol==='http:'&&!/^(localhost|127\.)/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash);/* GPS e câmera só funcionam em https */</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root,[data-theme="light"]{
    --red:var(--d-red);--red2:var(--d-red-vivo);--gold:var(--d-gold);--dark:var(--d-bg);--bg:var(--d-bg);
    --card:var(--d-card);--surface:var(--d-card-2);--border:var(--d-line);--text:var(--d-text);--muted:var(--d-muted);
    --green:var(--d-green);--yellow:var(--d-yellow);--danger:var(--d-danger);--orange:#e67e22;
  }
  body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;padding-bottom:100px}
  header{background:var(--dark);border-bottom:4px solid var(--red);padding:0 4vw;height:70px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .brand{font-family:Arial,sans-serif;font-size:1.4rem;font-weight:700;color:#fff}
  .brand span{color:var(--gold)}
  .header-title{font-size:0.85rem;color:#fff;font-weight:700}
  main{padding:20px 4vw 60px;display:flex;flex-direction:column;gap:20px;max-width:900px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
  .card-full{grid-column:1fr}
  .sel-label{font-size:0.85rem;font-weight:700;color:var(--gold);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em}
  select,input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:Arial,sans-serif;font-size:0.95rem;padding:12px 14px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--gold)}
  textarea{resize:vertical;min-height:70px;line-height:1.4}
  .btn{background:var(--red);color:#fff;border:none;border-radius:10px;padding:14px 20px;font-size:0.95rem;font-weight:700;cursor:pointer;width:100%;transition:background 0.2s}
  .btn:hover{background:var(--red2)}
  .btn:disabled{background:var(--d-line);color:var(--d-muted);cursor:not-allowed}
  .btn-secondary{background:var(--surface);border:1px solid var(--border)}
  .pend-card{background:rgba(255,68,68,0.08);border:1px solid var(--danger);border-radius:12px;padding:16px;margin-bottom:12px}
  .pend-card.reincidente{background:rgba(255,68,68,0.18);border:2px solid var(--danger)}
  .pend-item-label{font-weight:700;font-size:0.92rem;margin-bottom:6px}
  .pend-reincidencia-tag{display:inline-block;background:var(--danger);color:#fff;font-size:0.7rem;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:8px;text-transform:uppercase}
  .pend-detail{font-size:0.82rem;color:var(--muted);margin-bottom:4px}
  .pend-detail strong{color:var(--text)}
  .pend-toggle{display:flex;gap:10px;margin-top:10px}
  .pend-toggle button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:0.85rem;cursor:pointer}
  .pend-toggle button.sel-sim.active{background:var(--green);border-color:var(--green);color:var(--d-on-cor)}
  .pend-toggle button.sel-nao.active{background:var(--danger);border-color:var(--danger);color:#fff}
  .categoria{margin-bottom:6px}
  .categoria-titulo{font-size:1rem;font-weight:700;color:var(--gold);padding:10px 0 6px;border-bottom:2px solid var(--border);margin-bottom:10px}
  .item-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
  .item-nome{font-size:0.9rem;font-weight:600;margin-bottom:10px}
  .item-opts{display:flex;gap:8px}
  .item-opts button{flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;font-size:0.78rem;cursor:pointer;transition:all 0.15s}
  .item-opts button.ok.active{background:var(--green);border-color:var(--green);color:var(--d-on-cor)}
  .item-opts button.nok.active{background:var(--danger);border-color:var(--danger);color:#fff}
  .item-opts button.na.active{background:var(--muted);border-color:var(--muted);color:var(--d-on-cor)}
  .item-extra{display:none;margin-top:12px;gap:10px;flex-direction:column}
  .item-extra.show{display:flex}
  .item-extra label{font-size:0.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .progresso{position:fixed;bottom:0;left:0;right:0;background:var(--dark);border-top:1px solid var(--border);padding:14px 4vw;display:flex;align-items:center;gap:14px;z-index:60}
  .progresso-txt{font-size:0.8rem;color:var(--muted);white-space:nowrap}
  .progresso-txt strong{color:var(--gold)}
  .corr{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px}
  .corr.atrasada{border-color:var(--danger)}
  .corr.alvo{box-shadow:0 0 0 3px var(--gold)}
  .corr .acoes{display:flex;gap:8px;margin-top:10px}
  .corr .acoes button{flex:1;padding:11px;border-radius:8px;border:none;font-weight:700;font-size:0.85rem;cursor:pointer}
  .msg{padding:12px 16px;border-radius:10px;font-size:0.85rem;font-weight:700;text-align:center;display:none}
  .msg.ok{background:rgba(46,204,113,0.15);border:1px solid var(--green);color:var(--green)}
  .msg.err{background:rgba(255,68,68,0.15);border:1px solid var(--danger);color:var(--danger)}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  #telaSelecao{max-width:480px;margin:60px auto;padding:0 16px}
  #geoTela{display:none;position:fixed;inset:0;z-index:200;background:var(--d-bg);align-items:center;justify-content:center;padding:24px}
  #geoTela .box{max-width:440px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
  #geoTela .ico{font-size:3.2rem}
  #geoTela h2{color:var(--red2);font-size:1.25rem;letter-spacing:.03em}
  #geoTela p{color:var(--d-text2);font-size:.95rem;line-height:1.5}
  /* ── Visual novo (futurista, tema claro/escuro) ── */
  body{font-family:'Inter',Arial,sans-serif}
  header{background:var(--d-bg);border-bottom:1px solid var(--d-line);gap:10px}
  .card,.item,.item-row,.corr,.kpi,.dia{border-radius:16px}
  .btn{border-radius:12px}
  .btn:not(:disabled):not(.sec):not(.btn-secondary):not(.verde){box-shadow:var(--d-glow)}
  .tit,.secao,.categoria-titulo,.sel-label{font-family:'Space Grotesk',Inter,sans-serif}
  .num-grande,.nota-grande,.kpi b{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-0.02em}
  #toast{background:var(--d-card-2);color:var(--d-text);box-shadow:0 10px 30px rgba(0,0,0,0.25)}
  @media(max-width:380px){.hdr-tit small{display:none}}
</style>
</head>
<body>
<header class="dina-aneis">
  <div class="hdr-marca"><span class="logo-dina"><img src="logo-emblema.png" alt="Dina Pizza Gastronomia" width="44" height="43"></span><span class="hdr-tit"><b>Checklist do GDI</b><small>Visita às lojas · Dina Pizza</small></span></div>
  <div class="hdr-dir"><button type="button" class="tema-btn" onclick="temaAlternar()" aria-label="Mudar entre tema escuro e claro" title="Tema escuro / claro"><svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
</header>

<div id="telaSelecao">
  <div id="eqAlertaBox" style="display:none;margin-bottom:16px"></div>
  <div id="excBox" style="display:none;margin-bottom:16px"></div>
  <div id="plcBox" style="display:none;margin-bottom:16px"></div>
  <div id="corrBox" style="display:none;margin-bottom:16px"></div>
  <div class="card">
    <div class="sel-label">Selecione a unidade</div>
    <select id="selUnidade" onchange="document.getElementById('btnIniciar').disabled=!this.value">
      <option value="">Escolha a loja...</option>
    </select>
    <div style="height:14px"></div>
    <div class="sel-label">Seu nome (GDI)</div>
    <input type="text" id="nomeRegional" placeholder="Digite seu nome">
    <div style="height:18px"></div>
    <button class="btn" id="btnIniciar" disabled onclick="iniciarChecklist()">Iniciar Checklist</button>
  </div>
</div>

<main id="main" style="display:none"></main>

<div id="geoTela"><div class="box">
  <div class="ico" id="geoIco">📍</div>
  <h2 id="geoTitulo">CONFERINDO SUA LOCALIZAÇÃO</h2>
  <p id="geoTexto">Aguarde...</p>
  <button class="btn" id="geoBtn" onclick="conferirLocal(true)">📍 Conferir de novo</button>
  <button class="btn btn-secondary" onclick="trocarLoja()">← Escolher outra loja</button>
</div></div>

<div class="progresso" id="progresso" style="display:none">
  <div class="progresso-txt" id="progressoTxt">0 de 0 itens</div>
  <button class="btn" id="btnEnviar" onclick="enviarChecklist()" disabled>Enviar Checklist</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-MpaSNNJ_hb4Vw6X139dBGR_PmBFD8gXJwSfxgbuis9ulOEuN6Rcdg4_D6BbBwuFc/exec';
const TODAS_UNIDADES = ['Isaac Manhã','Isaac Noite','Água Verde','Uberaba','Campo Largo','Capão Raso','São José dos Pinhais','Expressa','Fazenda Rio Grande','Colombo','Araucária'];

const ESTRUTURA = [
  {cat:"Buffet — Saladas", itens:["Quantidade","Aparência","Variedade","Cozidos"]},
  {cat:"Buffet — Sobremesas", itens:["3 mousses","Duas frutas"]},
  {cat:"Buffet — Comidas", itens:["Arroz","Feijão","Strogonoff","Talharim","Rondelli","Lasanha bolonhesa","Batata rústica","Frango empanado","Sopas e caldos no frio (mín. 2 variedades)"]},
  {cat:"Buffet — Molhos", itens:["Cheddar (textura)","Barbecue (textura)","Ganache (textura)"]},
  {cat:"Pizza Doce", itens:["Quantidade de sabores (padrão 4, exceto banana/Califórnia/Romeu e Julieta)"]},
  {cat:"Pizzas Salgadas", itens:["Principais (máx. 2 sabores)","Variações (3 sabores)","Padrão da massa — gelada","Padrão da massa — peso","Padrão da massa — bolhas"]},
  {cat:"Frituras", itens:["Aparência","Variedade"]},
  {cat:"Limpeza do Buffet", itens:["Limpeza geral do buffet"]},
  {cat:"Atendimento", itens:["Quantidade de colaboradores",{label:"Quantas pessoas a unidade tem no atendimento",tipo:"numero"},"Abertura do buffet","Fechamento do buffet","Disposição do atendente do buffet"]},
  {cat:"Caixa", itens:["Posicionamento e repasse de informações"]},
  {cat:"Critérios de Avaliação (Equipe)", itens:["Quantidade","Postura","Qualidade"]},
  {cat:"Cozinha", itens:["Aparência","Limpeza","Desperdício","Quantidade de colaboradores","Funções — Pizza","Funções — Fritadeira","Funções — Fogão","Funções — Louças"]},
  {cat:"Depósito", itens:["Quantidade","Organização","Faltas"]},
  {cat:"Postura da Loja", itens:["Limpeza e organização","Dificuldades e melhorias"]},
  {cat:"Placar Diário", itens:["Placar diário está sendo preenchido corretamente"]},
  {cat:"Avaliações Negativas", itens:["Google negativo / Reclame Aqui — ação tomada para não repetir"]},
  {cat:"Limpeza — Banheiros e Lazer", itens:["Banheiro Masculino","Banheiro Feminino","Playground","Fliperama","Boliche"]},
  {cat:"Pendências Administrativas", itens:["Pendência com RH","Pendência com Administrativo (entrega de notes e caixas)","Pendência com o CD","Pendência com o Nutricionista da rede"]},
  {cat:"Cumprimento de Metas", itens:["A loja está cumprindo as metas diárias (conforme placar diário)"]},
];

// Itens: vêm do servidor (Admin > Checklist do GDI). Esta lista fixa só é usada se o servidor ainda não tiver a edição.
let SECOES=[]; // [{cat, itens:[{id,label,tipo}]}]
function secoesReserva(){ return ESTRUTURA.map(s=>({cat:s.cat,itens:s.itens.map(it=>({id:slugify(s.cat,it),label:itemLabel(it),tipo:itemTipo(it)}))})); }
function jsonp(params, ms){
  return new Promise((ok,falha)=>{
    const cb='rgCb_'+Date.now()+'_'+Math.floor(Math.random()*1e5), s=document.createElement('script');
    const t=setTimeout(()=>{limpar();falha(new Error('tempo esgotado'));}, ms||15000);
    function limpar(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=r=>{limpar();ok(r);};
    s.onerror=()=>{limpar();falha(new Error('sem conexão'));};
    s.src=SCRIPT_URL+'?'+Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')+'&t='+Date.now()+'&callback='+cb;
    document.head.appendChild(s);
  });
}
let _recursos=null;
async function recursos(){ if(_recursos) return _recursos; try{ const r=await jsonp({action:'authPing'},10000); _recursos=(r&&r.ok&&Array.isArray(r.recursos))?r.recursos:[]; }catch(e){ return []; } return _recursos; }
async function carregarItens(u){
  try{
    if((await recursos()).includes('regionalItens')){
      const r=await jsonp({action:'regItens'},20000);
      if(r&&r.ok&&Array.isArray(r.secoes)){
        SECOES=r.secoes.map(s=>({cat:s.secao,itens:s.itens.filter(it=>!(it.lojasExcluidas||[]).includes(u)).map(it=>({id:it.id,label:it.item,tipo:it.tipo}))})).filter(s=>s.itens.length);
        return;
      }
    }
  }catch(e){}
  SECOES=secoesReserva();
}

// ── Localização: o checklist só abre dentro da unidade visitada (mesmo cadastro do Admin > Lojas e celulares) ──
let _geoConferindo=null;
function geoMostrar(icone,titulo,html,comBotao){
  document.getElementById('geoIco').textContent=icone; document.getElementById('geoTitulo').textContent=titulo;
  document.getElementById('geoTexto').innerHTML=html; document.getElementById('geoBtn').style.display=comBotao?'block':'none';
  document.getElementById('geoTela').style.display='flex';
}
function geoEsconder(){ document.getElementById('geoTela').style.display='none'; }
function textoPermissao(){
  return /iPhone|iPad|iPod/.test(navigator.userAgent)
    ? '<b>No iPhone:</b> toque no ícone à esquerda do endereço do site › <b>Ajustes do Site</b> › <b>Localização</b> › <b>Permitir</b>. Se não resolver: <b>Ajustes</b> › <b>Privacidade e Segurança</b> › <b>Serviços de Localização</b> (ligado) › <b>Sites do Safari</b> › <b>Durante o Uso do App</b>.'
    : 'Toque no cadeado ao lado do endereço do site, permita a <b>Localização</b> e toque em “Conferir de novo”. Confira também se a localização (GPS) do celular está ligada.';
}
function conferirLocal(agora){
  if(_geoConferindo) return _geoConferindo;
  const bt=document.getElementById('geoBtn'); bt.disabled=true; bt.textContent='Conferindo...';
  _geoConferindo=(async()=>{
    try{
      if(!(await recursos()).includes('geoLoja')) return true;
      try{ const c=await jsonp({action:'geoConferir',unidade:unidadeAtual},15000); if(c&&c.ok&&c.configurado===false) return true; }catch(e){ return true; }
      if(!document.getElementById('geoTela').style.display||document.getElementById('geoTela').style.display==='none') geoMostrar('📍','CONFERINDO SUA LOCALIZAÇÃO','Confirmando que você está em <b>'+unidadeAtual+'</b>...',false);
      const pos=await new Promise(res=>{
        if(!navigator.geolocation) return res({erro:'falhou'});
        navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}), e=>res({erro:e.code===1?'negado':'falhou'}), {enableHighAccuracy:true,timeout:20000,maximumAge:agora===true?0:60000});
      });
      if(pos.erro==='negado'){ geoMostrar('📍','PERMITA A LOCALIZAÇÃO','O checklist da visita só abre dentro da unidade.<br><br>'+textoPermissao(),true); return false; }
      if(pos.erro){ geoMostrar('📍','NÃO CONSEGUI SUA LOCALIZAÇÃO','Ligue a <b>localização (GPS)</b> do celular e toque em “Conferir de novo”.',true); return false; }
      let r=null;
      try{ r=await jsonp({action:'geoConferir',unidade:unidadeAtual,lat:pos.lat,lng:pos.lng,acc:pos.acc,papel:'regional',aparelho:(nomeRegionalAtual||'').slice(0,30)},15000); }
      catch(e){ geoEsconder(); return true; } // servidor sem resposta: não trava a visita por isso
      if(!r||!r.ok||r.dentro){ geoEsconder(); return true; }
      const km=r.distancia>=1000?(r.distancia/1000).toFixed(1).replace('.',',')+' km':r.distancia+' m';
      geoMostrar('📍','VOCÊ NÃO ESTÁ NA UNIDADE','O checklist de <b>'+unidadeAtual+'</b> só pode ser feito <b>dentro da unidade</b>.<br><br>Você está a <b>'+km+'</b> da loja.<br><span style="font-size:12px;color:var(--d-muted)">Se você está na loja, vá para perto da porta ou de uma janela e toque em “Conferir de novo”. Esta tentativa fica registrada.</span>',true);
      return false;
    } finally { _geoConferindo=null; bt.disabled=false; bt.textContent='📍 Conferir de novo'; }
  })();
  return _geoConferindo;
}
function trocarLoja(){
  geoEsconder(); unidadeAtual='';
  document.getElementById('main').style.display='none'; document.getElementById('main').innerHTML='';
  document.getElementById('progresso').style.display='none';
  document.getElementById('telaSelecao').style.display='block';
  respostasItens={}; respostasPendencias={};
}

// ── Correções que os gerentes justificaram: o GDI confirma ou recusa em até 18 h (não precisa estar na loja) ──
let CORR=[];
const CORR_ALVO=new URLSearchParams(location.search).get('confirmar')||'';
const CORR_LOJA=new URLSearchParams(location.search).get('loja')||''; // link do WhatsApp com todas as correções de uma loja
function chaveGestao(){ try{ return localStorage.getItem('dina_gestao_hash')||sessionStorage.getItem('dina_gestao_hash')||''; }catch(e){ return ''; } }
async function carregarCorrecoes(){
  const box=document.getElementById('corrBox');
  try{
    if(!(await recursos()).includes('regionalPendencias')) return;
    // espera a senha da gestão ser confirmada
    for(let i=0;i<120 && (document.getElementById('gGuard')||document.getElementById('gGuardCss')); i++) await new Promise(r=>setTimeout(r,500));
    const r=await jsonp({action:'regPendAguardando',chave:chaveGestao()},20000);
    if(!r||!r.ok){ box.style.display='none'; return; }
    CORR=r.itens||[];
  }catch(e){ return; }
  renderCorrecoes();
}
function renderCorrecoes(){
  const box=document.getElementById('corrBox');
  if(!CORR.length){
    box.innerHTML=(CORR_ALVO||CORR_LOJA)?'<div class="card"><div class="sel-label">✅ Correções para confirmar</div><div style="color:var(--muted);font-size:0.9rem">Nada esperando confirmação agora (essa correção já foi confirmada ou voltou para o gerente).</div></div>':'';
    box.style.display=(CORR_ALVO||CORR_LOJA)?'block':'none'; return;
  }
  const atras=CORR.filter(c=>c.atrasada).length;
  const trav=CORR.filter(c=>c.horas>=24).length;
  box.innerHTML='<div class="card"><div class="sel-label">✅ Correções para confirmar ('+CORR.length+')</div>'+(trav?'<div style="background:rgba(255,68,68,0.15);border:2px solid var(--danger);border-radius:8px;padding:10px;margin:8px 0;font-weight:700">🔒 '+trav+' correção(ões) passaram de 24 h: a visita nova e o check-in da agenda ficam BLOQUEADOS até você responder.</div>':'')+'<div style="font-size:0.8rem;color:var(--muted)">Os gerentes contaram o que fizeram nas pendências da sua visita. Você tem <b>18 horas</b> para confirmar ou recusar'+(atras?' — <b style="color:var(--danger)">'+atras+' já passou do prazo</b>':'')+'.</div>'+
    CORR.map(c=>`<div class="corr${c.atrasada?' atrasada':''}${(c.pendId===CORR_ALVO||c.unidade===CORR_LOJA)?' alvo':''}" id="corr_${c.pendId}">
      <div style="font-weight:700">${esc(c.unidade)} · ${esc(c.itemLabel)}</div>
      <div class="pend-detail" style="margin-top:6px"><strong>Problema apontado:</strong> ${esc(c.descricao)||'—'}</div>
      <div class="pend-detail" style="background:rgba(46,204,113,0.08);border-left:3px solid var(--green);padding:8px 10px;border-radius:6px;margin:8px 0;color:var(--d-text2)"><strong>O que o gerente fez:</strong> ${esc(c.justificativa)||'(mandou só a foto)'}${c.foto&&/^https/.test(c.foto)?`<br><a href="${esc(c.foto)}" target="_blank" style="color:var(--gold);font-weight:700">📷 Ver a foto</a>`:''}</div>
      <div style="font-size:0.75rem;color:${c.atrasada?'var(--danger)':'var(--muted)'}">Justificado em ${esc(c.justificadaEm)} por ${esc(c.justificadaPor)} · ${c.atrasada?'<b>passou do prazo ('+c.horas+' h)</b>':'confirmar até '+esc(c.prazo)}</div>

function carregarPendencias(){
  const cb='pendCb_'+Date.now();
  const s=document.createElement('script');
  const t=setTimeout(()=>{delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);pendencias=[];renderTudo();},10000);
  window[cb]=(resp)=>{
    clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);
    pendencias=(resp&&resp.pendencias)||[];
    renderTudo();
  };
  s.onerror=()=>{clearTimeout(t);delete window[cb];pendencias=[];renderTudo();};
  s.src=SCRIPT_URL+'?action=getChecklistPendencias&unidade='+encodeURIComponent(unidadeAtual)+'&t='+Date.now()+'&callback='+cb;
  document.head.appendChild(s);
}

      </div>`;
    });
    html+='</div>';
  }

  SECOES.forEach(secao=>{
    html+=`<div class="card categoria"><div class="categoria-titulo">${esc(secao.cat)}</div>`;
    secao.itens.forEach(item=>{
      const id=item.id;
      const lbl=esc(item.label);
      if(item.tipo==='numero'){
        html+=`<div class="item-row" data-itemid="${id}">
          <div class="item-nome">${lbl}</div>
          <input type="number" inputmode="numeric" min="0" placeholder="0" id="num_${id}" oninput="marcarNumero('${id}')" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;padding:10px 14px">
        </div>`;
      } else {
        html+=`<div class="item-row" data-itemid="${id}">
          <div class="item-nome">${lbl}</div>
          <div class="item-opts">
            <button class="ok" onclick="marcarItem('${id}','conforme',this)">✅ Conforme</button>
            <button class="nok" onclick="marcarItem('${id}','nao_conforme',this)">⚠️ Não Conforme</button>
            <button class="na" onclick="marcarItem('${id}','na',this)">— N/A</button>
          </div>
          <div class="item-extra" id="extra_${id}">
            <div>
              <label>Descrição do problema</label>
              <textarea id="desc_${id}" placeholder="O que está errado?" oninput="atualizarTexto('${id}')"></textarea>
            </div>
            <div>
              <label>Sugestão de melhoria</label>
              <textarea id="sug_${id}" placeholder="O que deve ser feito para corrigir?" oninput="atualizarTexto('${id}')"></textarea>
            </div>
          </div>
        </div>`;
      }
    });
    html+='</div>';
  });

  html+='<div class="card"><div class="sel-label">Observações gerais da visita</div><textarea id="obsGeral" placeholder="Observações adicionais sobre a visita..."></textarea></div>';
  html+='<div class="msg ok" id="msgOk">✅ Checklist enviado com sucesso!</div>';
  html+='<div class="msg err" id="msgErr"></div>';

  main.innerHTML=html;
  document.getElementById('progresso').style.display='flex';
  atualizarProgresso();
}

function marcarResolucao(itemId, resolvido, btn){
  respostasPendencias[itemId]=resolvido;
  const card=btn.closest('.pend-card');
  card.querySelectorAll('.pend-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  atualizarProgresso();
}

function marcarItem(itemId, status, btn){
  if(!respostasItens[itemId]) respostasItens[itemId]={status:'',observacao:'',sugestao:''};
  respostasItens[itemId].status=status;
  const row=btn.closest('.item-row');
  row.querySelectorAll('.item-opts button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const extra=document.getElementById('extra_'+itemId);
  if(status==='nao_conforme'){extra.classList.add('show');}
  else{extra.classList.remove('show');}
  atualizarProgresso();
}

function marcarNumero(itemId){
  const valEl=document.getElementById('num_'+itemId);
  const valStr=valEl.value;
  if(valStr===''){ delete respostasItens[itemId]; }
  else { respostasItens[itemId]={status:'numero',valor:parseInt(valStr)||0,observacao:'',sugestao:''}; }
  atualizarProgresso();
}

function atualizarTexto(itemId){
  if(!respostasItens[itemId]) respostasItens[itemId]={status:'nao_conforme',observacao:'',sugestao:''};
  respostasItens[itemId].observacao=document.getElementById('desc_'+itemId).value;
  respostasItens[itemId].sugestao=document.getElementById('sug_'+itemId).value;
  atualizarProgresso();
}

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function totalItens(){
  return SECOES.reduce((n,s)=>n+s.itens.length,0);
}

function tudoValido(){
  // Todas as pendências precisam de resposta
  for(const p of pendencias){
    if(respostasPendencias[p.itemId]===undefined) return false;
  }
  // Todos os itens do checklist precisam de status
  let respondidos=0;
  for(const secao of SECOES){
    for(const item of secao.itens){
      const id=item.id;
      const r=respostasItens[id];
      if(!r || !r.status) return false;
      if(r.status==='nao_conforme' && (!r.observacao||!r.observacao.trim()||!r.sugestao||!r.sugestao.trim())) return false;
      respondidos++;
    }
  }
  return respondidos===totalItens();
}

function atualizarProgresso(){
  let respondidos=0;
  for(const secao of SECOES){
    for(const item of secao.itens){
      const id=item.id;
      if(respostasItens[id] && respostasItens[id].status) respondidos++;
    }
  }
  const total=totalItens();
  document.getElementById('progressoTxt').innerHTML=`<strong>${respondidos}</strong> de ${total} itens`;
  document.getElementById('btnEnviar').disabled=!tudoValido();
}

async function enviarChecklist(){
  if(!tudoValido()) return;
  const btn=document.getElementById('btnEnviar');
  btn.disabled=true;btn.textContent='Conferindo a localização...';
  if(!(await conferirLocal(true))){ btn.disabled=false; btn.textContent='Enviar Checklist'; return; }
  btn.textContent='Enviando...';

  const itensPayload=[];
  SECOES.forEach(secao=>{
    secao.itens.forEach(item=>{
      const id=item.id;
      const r=respostasItens[id];
      const lbl=secao.cat+' > '+item.label;
      if(r.status==='numero'){
        itensPayload.push({itemId:id,itemLabel:lbl,status:'numero',valor:r.valor,observacao:'',sugestao:''});
      } else {
        itensPayload.push({itemId:id,itemLabel:lbl,status:r.status,observacao:r.observacao||'',sugestao:r.sugestao||''});
      }
    });
  });

  const resolucoesPayload=pendencias.map(p=>({itemId:p.itemId,resolvido:!!respostasPendencias[p.itemId]}));

  const agora=new Date();
  const dataFmt=`${agora.getDate().toString().padStart(2,'0')}/${(agora.getMonth()+1).toString().padStart(2,'0')}/${agora.getFullYear()}`;
  const horaFmt=agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const payload={
    action:'salvarChecklist',
    unidade:unidadeAtual,
    data:dataFmt,
    hora:horaFmt,
    gerenteRegional:nomeRegionalAtual,
    observacaoGeral:document.getElementById('obsGeral').value,
    itens:itensPayload,
    resolucoes:resolucoesPayload
  };

  try{
    const resp=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});
    const respText=await resp.text();
    let respJson=null;
    try{respJson=JSON.parse(respText);}catch(e){}
    const falhou=!resp.ok||(respJson&&respJson.status&&respJson.status!=='ok');
    if(falhou){
      const detalhe=respJson?JSON.stringify(respJson):respText.slice(0,300);
      const errEl=document.getElementById('msgErr');
      errEl.innerHTML=`⚠ Erro ao salvar (HTTP ${resp.status}). Detalhe: ${detalhe}`;
      errEl.style.display='block';
      btn.disabled=false;btn.textContent='Enviar Checklist';
      return;
    }
    document.getElementById('msgOk').style.display='block';
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    btn.textContent='✅ Enviado';
  }catch(e){
    const errEl=document.getElementById('msgErr');
    errEl.innerHTML=`⚠ Erro de conexão: ${(e&&e.message)||e}. Seus dados NÃO foram perdidos, tente novamente.`;
    errEl.style.display='block';
    btn.disabled=false;btn.textContent='Enviar Checklist';
  }
}
</script>
<script src="atualizador.js?v=2"></script>

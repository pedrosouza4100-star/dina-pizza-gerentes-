<!DOCTYPE html>
<html lang="pt-BR">
<!-- Checklist dividido com a equipe (20/11/2026, servidor 2026-11-20-a, recurso chkDividido).
     Aberta pelo QR Code que o gerente mostra no placar (?t=<token>): sem senha, só a parte que ele passou, só dentro da loja.
     Modo teste do placar: ?teste=1&loja=<loja>&slug=<slug>&turno=<turno>&secao=<seção>&pessoa=<nome> — mostra os itens e não grava nada. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Checklist da equipe — Dina Pizza</title>
<meta name="theme-color" content="#07090E">
<link rel="stylesheet" href="dina-tema.css?v=2">
<script src="dina-tema.js?v=1"></script>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:var(--d-bg);--card:var(--d-card);--surface:var(--d-surface);--border:var(--d-line);--text:var(--d-text);--muted:var(--d-muted);--green:var(--d-green);--gold:var(--d-gold);--red:var(--d-red)}
body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--d-surface);border-bottom:1px solid var(--border)}
header img{width:40px;height:40px}
.h-tit{font-weight:900;font-size:1rem}.h-sub{font-size:.78rem;color:var(--muted)}
main{padding:16px;max-width:620px;margin:0 auto 60px}
.teste{background:#4b1d7a;color:#fff;font-weight:800;text-align:center;padding:8px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.ola{font-size:1.15rem;font-weight:900}.muted{color:var(--muted);font-size:.85rem;line-height:1.4}
.parte{display:inline-block;margin-top:8px;background:var(--surface);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:5px 10px;font-weight:800;font-size:.85rem}
.item{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface)}
.item.falta{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.item-txt{font-weight:700;font-size:.95rem}
.bts{display:flex;gap:10px;margin-top:10px}
.bts button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.2rem;font-weight:900;cursor:pointer}
.bts .ok.sel{background:var(--green);color:#06110b;border-color:var(--green)}
.bts .nok.sel{background:var(--red);color:#fff;border-color:var(--red)}
textarea{width:100%;margin-top:10px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-size:.92rem;font-family:inherit;min-height:64px}
.linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.85rem}
.linha img{max-width:140px;border-radius:8px}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-weight:900;font-size:1rem;cursor:pointer;background:var(--red);color:#fff;margin-top:14px}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:9px 12px;width:auto;font-size:.82rem;margin-top:0}
.btn:disabled{opacity:.55}
.msg{margin-top:10px;font-size:.9rem;font-weight:700;min-height:18px}
.fim{text-align:center;font-size:1.05rem;line-height:1.5}
.fim b{font-size:2.6rem;display:block}
#camModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:14px;gap:10px}
#camModal video{width:100%;max-width:520px;border-radius:12px;background:#000}
#camMsg{color:#fff;font-size:.88rem;text-align:center}
</style>
</head>
<body>
<div id="testeBar" class="teste" style="display:none">🧪 MODO TESTE — é assim que a pessoa da equipe vê. Nada é gravado.</div>
<header><img src="logo-emblema.png" alt="Dina Pizza"><div><div class="h-tit">Dina Pizza · Checklist da equipe</div><div class="h-sub" id="hLoja">Carregando…</div></div></header>
<main id="main"><div class="card muted">Carregando a sua parte do checklist…</div></main>
<div id="camModal"><video id="camVideo" playsinline muted autoplay></video><div id="camMsg"></div>
  <div style="display:flex;gap:10px"><button class="btn" id="camBater" style="width:auto;margin:0" onclick="camBater()">📷 Bater foto</button><button class="btn sec" onclick="camFechar('cancelar')">Cancelar</button></div></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby-MpaSNNJ_hb4Vw6X139dBGR_PmBFD8gXJwSfxgbuis9ulOEuN6Rcdg4_D6BbBwuFc/exec';
const Q=new URLSearchParams(location.search), TESTE=Q.get('teste')==='1', TOKEN=Q.get('t')||'';
let D=null, RESP={}, OBS={}, RESOLV={}, FOTO={}, TENTOU=false, ENVIANDO=false, MIN=5;
// 📷 foto obrigatória conferida pela IA (servidor 2026-11-20-d): item com foto só é marcado depois da foto
const MOSTRAR={buffet:'o buffet montado (as cubas com comida)',refrigerante:'a máquina de refrigerante (o painel e os bicos)',tv:'as TVs do salão',ar:'o aparelho de ar-condicionado',gas:'o cilindro de gás com o relógio de pressão',termostato:'o painel do termostato do buffet (o número da temperatura)'};
const TEMP={}, TFX=[80,90]; // termostato do buffet (21/11/2026): a IA lê; se não ler, digita
function tempPor(id,val){ const n=parseFloat(String(val).replace(',','.')); const t=TEMP[id]=TEMP[id]||{v:null,lido:null}; t.v=isFinite(n)?Math.round(n*10)/10:null; }
function tempOk(id,val){ tempPor(id,val); const t=TEMP[id]; if(t.v!==null&&(t.v<TFX[0]||t.v>TFX[1])){ RESP[id]='nao_conforme'; if((OBS[id]||'').trim().length<MIN) OBS[id]='Temperatura do buffet '+t.v+' °C (o certo é de '+TFX[0]+' a '+TFX[1]+' °C)'; } desenhar(); }
const GAS={}; function pronto(id,t){ return fotoOk(id)&&(t!=='gas'||!!GAS[id])&&(t!=='termostato'||!!(TEMP[id]&&TEMP[id].v!==null)); }
function gasMarcar(id,n){ GAS[id]=n; if(n==='acabando'){ RESP[id]='nao_conforme'; if((OBS[id]||'').trim().length<MIN) OBS[id]='Gás acabando (ponteiro no vermelho)'; } desenhar(); }
const FIA={}; // id → {ia, tent, msg, conferindo}
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsonp(params){ return new Promise((res,rej)=>{ const cb='ecCb_'+Date.now()+Math.floor(Math.random()*999), s=document.createElement('script');
  const t=setTimeout(()=>{ delete window[cb]; s.remove(); rej(new Error('tempo')); },25000);
  window[cb]=j=>{ clearTimeout(t); delete window[cb]; s.remove(); res(j); }; s.onerror=()=>{ clearTimeout(t); delete window[cb]; rej(new Error('rede')); };
  s.src=SCRIPT_URL+'?'+new URLSearchParams(Object.assign(params,{callback:cb,_:Date.now()})).toString(); document.head.appendChild(s); }); }
function rasc(){ return 'eqchk_'+(TOKEN||'teste'); }
function guardar(){ try{ localStorage.setItem(rasc(),JSON.stringify({RESP,OBS,RESOLV})); }catch(e){} }
function restaurar(){ try{ const g=JSON.parse(localStorage.getItem(rasc())||'null'); if(g){ RESP=g.RESP||{}; OBS=g.OBS||{}; RESOLV=g.RESOLV||{}; } }catch(e){} }

async function iniciar(){
  if(TESTE){
    document.getElementById('testeBar').style.display='block';
    let it=[]; try{ const r=await jsonp({action:'getChecklistItens',loja:Q.get('slug')||'',unidade:Q.get('loja')||'',turno:Q.get('turno')||'abertura'}); it=(r&&r.itens||[]).filter(x=>String(x.secao)===String(Q.get('secao')||'')).map(x=>({id:String(x.id),item:x.item})); }catch(e){}
    if(!it.length) it=[{id:'t1',item:'(exemplo) Primeiro item desta parte'},{id:'t2',item:'(exemplo) Segundo item desta parte'}];
    D={ok:true,unidade:Q.get('loja')||'Loja',turno:Q.get('turno')||'abertura',secao:Q.get('secao')||'Parte',pessoa:Q.get('pessoa')||'Colaborador',situacao:'aberta',confere:false,itens:it};
  } else {
    if(!TOKEN){ erro('Este endereço não tem o código do QR. Peça ao gerente para mostrar o QR Code de novo.'); return; }
    try{ D=await jsonp({action:'chkDelAbrir',tk:TOKEN}); }catch(e){ D=null; }
    if(!D||!D.ok){ erro((D&&D.erro)||'Sem conexão. Confira a internet e abra o QR de novo.'); return; }
  }
  MIN=D.minDesc||5; restaurar(); desenhar();
}
function erro(t){ document.getElementById('hLoja').textContent='';
  document.getElementById('main').innerHTML='<div class="card fim"><b>⚠️</b>'+esc(t)+'</div>'; }

function desenhar(){
  document.getElementById('hLoja').textContent=D.unidade+' · '+(D.turno==='fechamento'?'Checklist de fechamento':'Checklist de abertura');
  if(D.situacao==='confirmada'){ document.getElementById('main').innerHTML='<div class="card fim"><b>✅</b>O gerente já conferiu e confirmou esta parte.<br>Obrigado, '+esc(D.pessoa.split(' ')[0])+'!</div>'; return; }
  let h='<div class="card"><div class="ola">Olá, '+esc(D.pessoa.split(' ')[0])+'!</div>'+
    '<div class="muted" style="margin-top:6px">O gerente passou esta parte do checklist para você. Confira cada item <b>de verdade</b> e marque ✓ (está certo) ou ✗ (tem problema). Tudo fica gravado com o seu nome e o gerente vai conferir.</div>'+
    '<div class="parte">'+esc(D.secao)+'</div>'+
    (D.situacao==='enviada'?'<div class="muted" style="margin-top:10px;color:var(--gold)">Você já enviou às '+esc(D.enviadoHora||'')+'. Se precisar corrigir, mude e envie de novo antes de o gerente confirmar.</div>':'')+'</div>';
  D.itens.forEach(it=>{
    const id=String(it.id), r=RESP[id]||'', falta=TENTOU&&(!r||(r==='nao_conforme'&&(OBS[id]||'').trim().length<MIN)||(it.foto&&!pronto(id,it.foto)));
    h+='<div class="item'+(falta?' falta':'')+'" data-id="'+id+'"><div class="item-txt">'+esc(it.item)+'</div>'+(it.foto?fotoObrigHtml(id,it.foto):'')+
      '<div class="bts"'+(it.foto&&!pronto(id,it.foto)?' style="opacity:.35"':'')+'><button class="ok'+(r==='conforme'?' sel':'')+'" onclick="responder(\''+id+'\',\'conforme\')">✓</button><button class="nok'+(r==='nao_conforme'?' sel':'')+'" onclick="responder(\''+id+'\',\'nao_conforme\')">✗</button></div>'+
      (r==='nao_conforme'?'<textarea placeholder="Descreva o problema (obrigatório)" oninput="OBS[\''+id+'\']=this.value;guardar();botao()">'+esc(OBS[id]||'')+'</textarea>'+
        (it.foto?'':'<div class="linha"><button type="button" class="btn sec" onclick="camAbrir(\''+id+'\')">📷 '+(FOTO[id]?'Tirar outra foto':'Tirar foto agora (opcional)')+'</button>'+(FOTO[id]?'<img src="'+FOTO[id]+'">':'')+'</div>')+
        '<label class="linha" style="cursor:pointer"><input type="checkbox" style="width:18px;height:18px" '+(RESOLV[id]?'checked':'')+' onchange="RESOLV[\''+id+'\']=this.checked;guardar()"> Já resolvi este problema</label>':'')+
      '</div>';
  });
  h+='<button class="btn" id="btEnviar" onclick="enviar()">Enviar para o gerente</button><div class="msg" id="msg"></div>';
  document.getElementById('main').innerHTML=h; botao();
}
function responder(id,st){ const it=D.itens.find(x=>String(x.id)===id); if(it&&it.foto&&!fotoOk(id)){ fotoTirar(id); return; } if(it&&it.foto==='gas'&&!GAS[id]){ alert('Primeiro marque onde está o ponteiro do relógio do gás.'); return; } if(it&&it.foto==='termostato'){ const t=TEMP[id]; if(!t||t.v===null){ alert('Primeiro informe a temperatura do painel.'); return; } if((t.v<TFX[0]||t.v>TFX[1])&&st==='conforme'){ alert('Temperatura fora de '+TFX[0]+'–'+TFX[1]+' °C: o item fica com problema.'); return; } } if(it&&GAS[id]==='acabando'&&st==='conforme'){ alert('Gás 🔴 acabando: o item fica com problema.'); return; } RESP[id]=st; guardar(); const y=window.scrollY; desenhar(); window.scrollTo(0,y); }
function faltam(){ return D.itens.filter(it=>{ const id=String(it.id), r=RESP[id]; return !r||(r==='nao_conforme'&&(OBS[id]||'').trim().length<MIN)||(it.foto&&!pronto(id,it.foto)); }).length; }
function fotoOk(id){ return !!(FIA[id]&&FIA[id].ia&&FOTO[id]); }
function fotoObrigHtml(id,tipo){
  const x=FIA[id]||{}, m=MOSTRAR[tipo]||'o item';
  if(x.conferindo) return '<div class="muted" style="margin-top:8px">⏳ Conferindo a foto…</div>';
  if(fotoOk(id)&&tipo==='termostato'){ const t=TEMP[id]||{v:null,lido:null};
    return '<div class="linha"><img src="'+FOTO[id]+'"><b style="color:'+(t.lido!==null?'var(--green)':'#ffb020')+'">'+(t.lido!==null?'✅ A IA leu '+t.lido+' °C':'⚠️ Digite a temperatura que aparece no painel')+'</b><button type="button" class="btn sec" onclick="fotoTirar(\''+id+'\')">Tirar outra</button></div><div style="font-weight:700;margin:8px 0 4px">🌡️ Temperatura: <input type="number" inputmode="decimal" value="'+(t.v===null?'':t.v)+'" oninput="tempPor(\''+id+'\',this.value)" onchange="tempOk(\''+id+'\',this.value)" style="width:90px;padding:8px;font-size:16px;font-weight:800"> °C (certo: '+TFX[0]+' a '+TFX[1]+' °C)</div>'; }
  if(fotoOk(id)&&tipo==='gas'){ const g=GAS[id]||'', b=(v,t,c)=>'<button type="button" onclick="gasMarcar(\''+id+'\',\''+v+'\')" style="flex:1;padding:10px 4px;border-radius:10px;font-weight:800;border:2px solid '+(g===v?c:'var(--border)')+';background:'+(g===v?c:'var(--card)')+';color:'+(g===v?'#06110b':'var(--text)')+'">'+t+'</button>';
    return '<div class="linha"><img src="'+FOTO[id]+'"><b style="color:var(--green)">📷 Foto guardada</b><button type="button" class="btn sec" onclick="fotoTirar(\''+id+'\')">Tirar outra</button></div><div style="font-weight:700;margin:8px 0 4px">Onde está o ponteiro do relógio do gás?</div><div style="display:flex;gap:6px">'+b('cheio','🟢 Cheio','#2ecc71')+b('metade','🟡 Metade','#ffd000')+b('acabando','🔴 Acabando','#ff4d4d')+'</div>'; }
  if(fotoOk(id)) return '<div class="linha"><img src="'+FOTO[id]+'"><b style="color:'+(x.ia==='conferir'?'var(--gold)':'var(--green)')+'">'+(x.ia==='conferir'?'⚠️ Foto aceita — vai ser conferida':x.ia==='sem_ia'?'📷 Foto guardada':'✅ Foto conferida')+'</b><button type="button" class="btn sec" onclick="fotoTirar(\''+id+'\')">Tirar outra</button></div>';
  return '<div style="margin-top:8px;border:1px dashed var(--gold);border-radius:10px;padding:9px">'+(x.msg?'<div style="color:var(--red);font-weight:700;font-size:.85rem;margin-bottom:6px">'+esc(x.msg)+'</div>':'')+'<button type="button" class="btn sec" style="width:100%;padding:11px;font-weight:800" onclick="fotoTirar(\''+id+'\')">📷 Bata a foto antes de marcar: mostre '+esc(m)+'</button></div>';
}
function fotoTirar(id){ _camDepois=async foto=>{
  const it=D.itens.find(x=>String(x.id)===id), x=FIA[id]=Object.assign(FIA[id]||{tent:0},{conferindo:true,msg:''}); desenhar();
  let r=null;
  if(TESTE){ try{ const y=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'chkDelFotoConferir',unidade:Q.get('loja')||'',senha:(sessionStorage.getItem('dina_teste_admin')||''),tipo:it.foto,foto})}); r=JSON.parse(await y.text()); }catch(e){} }
  else { try{ const y=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'chkDelFotoConferir',tk:TOKEN,tipo:it.foto,foto})}); r=JSON.parse(await y.text()); }catch(e){} }
  x.conferindo=false;
  if(it.foto==='termostato'){ FOTO[id]=foto; const lido=r&&r.ok&&r.temp!==undefined&&r.temp!==null?Number(r.temp):null; x.ia=lido!==null?'ok':(r&&r.ok&&!r.semIa?'conferir':'sem_ia'); TEMP[id]={v:lido,lido:lido}; if(lido!==null) tempOk(id,lido); else desenhar(); return; }
  if(!r||!r.ok||r.reconheceu===null||r.semIa){ FOTO[id]=foto; x.ia='sem_ia'; }
  else if(r.reconheceu){ FOTO[id]=foto; x.ia='ok'; }
  else { x.tent=(x.tent||0)+1; if(x.tent>=2){ FOTO[id]=foto; x.ia='conferir'; } else { x.ia=''; delete FOTO[id]; x.msg=(r.motivo||'Não reconheci o equipamento na foto. Bata de novo.')+' (tentativa 1 de 2)'; } }
  desenhar(); }; camAbrir(id); }
function botao(){ const b=document.getElementById('btEnviar'); if(!b) return; const n=faltam(); b.textContent=n?'Confira todos os itens (faltam '+n+')':'Enviar para o gerente'; }
function posicao(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>res(null),{enableHighAccuracy:true,timeout:20000,maximumAge:0}); }); }
async function enviar(){
  if(ENVIANDO) return; const msg=document.getElementById('msg');
  if(faltam()){ TENTOU=true; desenhar(); const f=document.querySelector('.item.falta'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'});
    document.getElementById('msg').textContent='Responda todos os itens. Item com ✗ precisa da descrição do problema.'; document.getElementById('msg').style.color='var(--red)'; return; }
  ENVIANDO=true; const b=document.getElementById('btEnviar'); b.disabled=true;
  try{
    if(TESTE){ fim('🧪 No teste nada foi enviado. De verdade, o gerente veria agora "feito por '+D.pessoa.split(' ')[0]+'" e confirmaria.'); return; }
    let c=null; if(D.confere){ msg.style.color='var(--muted)'; msg.textContent='📍 Conferindo se você está na loja…'; c=await posicao();
      if(!c){ msg.style.color='var(--red)'; msg.textContent='📍 Ligue a localização do celular e permita para este site. Esta parte só pode ser enviada dentro da loja.'; return; } }
    msg.style.color='var(--muted)'; msg.textContent='Enviando…';
    const R={}; D.itens.forEach(it=>{ const id=String(it.id); R[id]={status:RESP[id],obs:RESP[id]==='nao_conforme'?(OBS[id]||'').trim():'',resolvido:RESP[id]==='nao_conforme'&&!!RESOLV[id],foto:(RESP[id]==='nao_conforme'||it.foto)&&FOTO[id]?FOTO[id]:'',fotoIA:it.foto?((FIA[id]||{}).ia||'sem_ia'):'',nivel:it.foto==='gas'?(GAS[id]||''):'',temp:it.foto==='termostato'&&TEMP[id]?TEMP[id].v:null,tempLida:it.foto==='termostato'&&TEMP[id]?(TEMP[id].lido!==null&&TEMP[id].v===TEMP[id].lido):false}; });
    let r=null; try{ const x=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'chkDelEnviar',tk:TOKEN,respostas:R,lat:c?c.latitude:'',lng:c?c.longitude:'',acc:c?c.accuracy:''})}); r=JSON.parse(await x.text()); }catch(e){ r=null; }
    if(!(r&&r.ok)){ msg.style.color='var(--red)'; msg.textContent='Não enviou: '+((r&&r.erro)||'sem conexão. Tente de novo.'); return; }
    try{ localStorage.removeItem(rasc()); }catch(e){}
    fim('Enviado às '+esc(r.hora)+'. Avise o gerente que a sua parte está pronta para ele conferir.');
  } finally { ENVIANDO=false; if(b) b.disabled=false; }
}
function fim(t){ document.getElementById('main').innerHTML='<div class="card fim"><b>✅</b>'+t+'</div>'; window.scrollTo(0,0); }

// câmera ao vivo (sem galeria), com carimbo de data, hora, loja e nome
let _camAlvo='', _camStream=null, _camDepois=null;
async function camAbrir(id){
  _camAlvo=id; const m=document.getElementById('camModal'), msg=document.getElementById('camMsg'), bt=document.getElementById('camBater');
  m.style.display='flex'; bt.disabled=true; msg.textContent='Abrindo a câmera…';
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ msg.textContent='Não consegui abrir a câmera neste celular. Abra no Chrome ou no Safari.'; return; }
  try{ _camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    const v=document.getElementById('camVideo'); v.srcObject=_camStream; await v.play().catch(()=>{}); msg.textContent='Aponte para o problema e toque em “Bater foto”.'; bt.disabled=false;
  }catch(e){ msg.textContent='A câmera foi bloqueada. Toque no cadeado ao lado do endereço, permita a Câmera e tente de novo.'; }
}
function camFechar(){ if(arguments[0]==='cancelar') _camDepois=null; if(_camStream){ _camStream.getTracks().forEach(t=>t.stop()); _camStream=null; } document.getElementById('camModal').style.display='none'; }
function camBater(){
  const v=document.getElementById('camVideo'); if(!v.videoWidth) return;
  const e=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement('canvas'); c.width=Math.round(v.videoWidth*e); c.height=Math.round(v.videoHeight*e);
  const x=c.getContext('2d'); x.drawImage(v,0,0,c.width,c.height);
  const t=new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})+' · '+D.unidade+' · '+D.pessoa; const fs=Math.max(16,Math.round(c.width/40));

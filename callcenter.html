<!DOCTYPE html>
<html lang="pt-BR">
<!-- Painel do call center (igual ao serveCallCenter do Apps Script; a cópia de lá usa o endereço do próprio servidor). Dados: getCallCenter; botão Cobrar gerente: POST ccCobrar (08/11/2026). -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Call Center — Dina Pizza</title>
<meta name="theme-color" content="#07090E">
<link rel="stylesheet" href="dina-tema.css?v=2">
<script src="dina-tema.js?v=1"></script>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:var(--d-bg);--card:var(--d-card);--surface:var(--d-surface);--border:var(--d-line);--text:var(--d-text);--muted:var(--d-muted);--green:var(--d-green);--yellow:var(--d-yellow);--danger:var(--d-danger);--gold:var(--d-gold)}
body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4vw;background:var(--d-surface);border-bottom:1px solid var(--border);overflow:hidden}
.hdr-dir{display:flex;align-items:center;gap:12px}
.update-info{font-size:.74rem;color:var(--muted);text-align:right}
.update-info b{color:var(--gold)}
main{padding:18px 4vw 80px;display:flex;flex-direction:column;gap:18px}
.resumo{display:flex;gap:10px;flex-wrap:wrap}
.res-chip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:.85rem;font-weight:700}
.res-chip b{font-size:1.2rem;margin-right:4px}
.res-chip.ruim b{color:var(--danger)} .res-chip.ok b{color:var(--green)} .res-chip.aviso b{color:var(--yellow)}
.bloco-sep{font-size:1.02rem;font-weight:800;color:var(--text);padding:4px 0 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.bloco-sep small{font-weight:600;color:var(--muted);font-size:.78rem}
.lojas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.loja-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.loja-card.pend{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
.loja-card.atencao{border-color:var(--yellow)}
.loja-topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loja-nome{font-size:1.08rem;font-weight:800}
.tag{font-size:.66rem;font-weight:800;padding:4px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag-pend{background:var(--d-red-soft);color:var(--d-t-err);border:1px solid var(--danger)}
.tag-ok{background:rgba(61,220,151,.12);color:var(--d-t-ok);border:1px solid rgba(61,220,151,.4)}
.tag-aviso{background:rgba(255,208,0,.12);color:var(--d-t-info);border:1px solid rgba(255,208,0,.45)}
.rot{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin-bottom:5px}
.tempos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tp{border-radius:12px;padding:9px 8px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:3px;min-height:92px}
.tp .tp-n{font-size:.7rem;font-weight:800;color:var(--muted)}
.tp .tp-est{font-size:.8rem;font-weight:800}
.tp .tp-val{font-size:.78rem;line-height:1.35}
.tp.ok{border-color:rgba(61,220,151,.45)} .tp.ok .tp-est{color:var(--green)}
.tp.aberto{border-color:var(--yellow)} .tp.aberto .tp-est{color:var(--yellow)}
.tp.nao{border-color:var(--danger);background:var(--d-red-soft)} .tp.nao .tp-est{color:var(--danger)}
.tp.espera .tp-est{color:var(--muted)}
.tp .num-ruim{color:var(--danger);font-weight:800} .tp .num-ok{color:var(--green);font-weight:800}
.cobrar{margin-top:4px;border:none;border-radius:9px;padding:7px 6px;font-weight:800;font-size:.74rem;cursor:pointer;background:var(--d-red);color:#fff}
.cobrar:disabled{opacity:.55;cursor:default}
.cobrado{font-size:.68rem;color:var(--d-t-info);font-weight:700}
.linha2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.box{border-radius:12px;padding:10px;border:1px solid var(--border);background:var(--surface);font-size:.9rem;font-weight:800}
.box.ok{color:var(--green)} .box.ruim{border-color:var(--danger);background:var(--d-red-soft);color:var(--d-t-err)} .box.aviso{border-color:var(--yellow);color:var(--d-t-info)} .box.vazio{color:var(--muted);font-weight:600;font-size:.82rem}
.box small{display:block;font-weight:600;color:var(--muted);font-size:.7rem;margin-top:2px}
.countdown-bar{position:fixed;bottom:0;left:0;right:0;background:var(--d-surface);border-top:1px solid var(--border);padding:9px 4vw;display:flex;align-items:center;justify-content:space-between;z-index:100;font-size:.8rem;font-weight:700}
.countdown-progress{height:4px;background:var(--border);border-radius:2px;flex:1;margin:0 14px;overflow:hidden}
.countdown-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 1s linear}
.countdown-timer{color:var(--gold)}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--d-card-2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:700;z-index:200;display:none;max-width:92vw;text-align:center}
@media(max-width:700px){ .lojas-grid{grid-template-columns:1fr} main{padding:14px 4vw 80px} .hdr-tit small{display:none} }
</style>
</head>
<body>
<header class="dina-aneis">
  <div class="hdr-marca"><span class="logo-dina"><img src="logo-emblema.png" alt="Dina Pizza Gastronomia" width="44" height="43"></span><span class="hdr-tit"><b>Painel do call center</b><small>Tempos, motoboys e falta de produto · tempo real</small></span></div>
  <div class="hdr-dir"><div class="update-info" id="updateInfo">Carregando...</div><button type="button" class="tema-btn" onclick="temaAlternar()" aria-label="Mudar entre tema escuro e claro" title="Tema escuro / claro"><svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
</header>

<main id="main"><div class="loading">⏳ Carregando dados em tempo real...</div></main>

<div class="countdown-bar">
  <div>⚡ Atualiza sozinho em</div>
  <div class="countdown-progress"><div class="countdown-fill" id="countdownFill" style="width:100%"></div></div>
  <div class="countdown-timer" id="countdownTimer">0:30</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-MpaSNNJ_hb4Vw6X139dBGR_PmBFD8gXJwSfxgbuis9ulOEuN6Rcdg4_D6BbBwuFc/exec'; // endereço oficial (não muda)
const LOJAS_ENTREGA = ['Expressa','Capão Raso','Água Verde','Uberaba','Colombo','Fazenda Rio Grande'];
const JANELAS_PADRAO = [{n:1,inicio:'18:30',fim:'19:30',label:'18h30 às 19h30'},{n:2,inicio:'20:00',fim:'21:00',label:'20h às 21h'},{n:3,inicio:'21:30',fim:'22:30',label:'21h30 às 22h30'}];
const INTERVALO = 30;
let segundosRestantes = INTERVALO, dadosAtual = null;

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',4500); }
function temEntrega(d){ return d.temEntrega!==undefined ? d.temEntrega : LOJAS_ENTREGA.includes(d.unidade); }
function hmMin(h){ const p=String(h||'0:0').split(':'); let m=Number(p[0])*60+Number(p[1]||0); if(Number(p[0])<4) m+=1440; return m; }

function carregarDados(){
  const cb='ccCb_'+Date.now(), s=document.createElement('script');
  const t=setTimeout(()=>{ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); if(dadosAtual) renderDados(dadosAtual); },15000);
  window[cb]=(json)=>{
    clearTimeout(t); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s);
    if(json && json.dados){
      dadosAtual=json; renderDados(json);
      document.getElementById('updateInfo').innerHTML='Atualizado às <b>'+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</b>';
      segundosRestantes=INTERVALO;
    }
  };
  s.onerror=()=>{ clearTimeout(t); delete window[cb]; };
  s.src=SCRIPT_URL+'?action=getCallCenter&t='+Date.now()+'&callback='+cb;
  document.head.appendChild(s);
}

// estado de cada horário de tempo: ok · aberto (faltam X min) · nao (passou sem registro) · espera (ainda não abriu)
function estadoTempos(d, json){
  const jan=json.janelas||JANELAS_PADRAO, agora=hmMin(json.agora||new Date().toTimeString().slice(0,5));
  const feitos={}; (d.temposEntrega||[]).forEach((t,i)=>{ const n=Number(t.registro)||(i+1); feitos[n]=t; });
  return jan.map(j=>{
    const t=feitos[j.n]; if(t) return {j, est:'ok', t};
    const ini=hmMin(j.inicio), fim=hmMin(j.fim);
    if(agora<ini) return {j, est:'espera'};
    if(agora<=fim) return {j, est:'aberto', falta:fim-agora};
    return {j, est:'nao'};
  });
}
function pendencias(d, json){
  const p=[];
  if(temEntrega(d)){
    estadoTempos(d,json).forEach(e=>{ if(e.est==='aberto') p.push('aberto'); if(e.est==='nao') p.push('nao'); });
    if(d.motoboysInformado===false) p.push('moto');
  }
  if(d.faltaProduto && d.faltaProduto.status==='sim') p.push('falta');
  return p;
}

function renderDados(json){
  const dados=(json.dados||[]).slice(), main=document.getElementById('main');
  const peso=d=>{ const p=pendencias(d,json); return (p.includes('nao')?100:0)+(p.includes('aberto')?50:0)+(p.includes('falta')?20:0)+(p.includes('moto')?10:0); };
  const comEntrega=dados.filter(temEntrega).sort((a,b)=>peso(b)-peso(a));
  const semEntrega=dados.filter(d=>!temEntrega(d)).sort((a,b)=>peso(b)-peso(a));
  let nNao=0,nAberto=0,nFalta=0;
  dados.forEach(d=>{ const p=pendencias(d,json); if(p.includes('nao')) nNao++; if(p.includes('aberto')) nAberto++; if(p.includes('falta')) nFalta++; });
  main.innerHTML=`
    <div class="resumo">
      <div class="res-chip ${nNao?'ruim':'ok'}"><b>${nNao}</b> com tempo não feito</div>
      <div class="res-chip ${nAberto?'aviso':'ok'}"><b>${nAberto}</b> com horário aberto sem registro</div>
      <div class="res-chip ${nFalta?'ruim':'ok'}"><b>${nFalta}</b> com falta de produto</div>
    </div>
    <div class="bloco-sep">🛵 Lojas com entrega própria <small>com pendência primeiro</small></div>
    <div class="lojas-grid">${comEntrega.map(d=>renderLoja(d,json)).join('')}</div>
    <div class="bloco-sep">🏪 Demais lojas <small>falta de produto</small></div>
    <div class="lojas-grid">${semEntrega.map(d=>renderLoja(d,json)).join('')}</div>`;
}

function renderFalta(d){
  const f=d.faltaProduto;
  if(!f) return '<div class="box vazio">⏳ Ainda não informado</div>';
  if(f.status==='nao') return '<div class="box ok">✅ Sem falta</div>';
  if(f.status==='sim') return '<div class="box ruim">⚠️ Falta: '+esc(f.descricao||'—')+(f.hora?'<small>informado às '+esc(f.hora)+'</small>':'')+'</div>';
  return '<div class="box vazio">⏳ Ainda não informado</div>';
}
function renderMoto(d){
  if(d.motoboysInformado===false) return '<div class="box aviso">⚠️ Não informado</div>';
  const m=d.motoboys||0, meta=d.metaMotoboys||0;
  return '<div class="box '+(meta&&m<meta?'ruim':'ok')+'">🛵 '+m+' motoboy'+(m===1?'':'s')+(meta?'<small>meta '+meta+'</small>':'')+'</div>';
}
function renderTempo(e, d){
  const cob=(d.cobrancas||{})[e.j.n];
  const botao=(e.est==='aberto'||e.est==='nao')?(cob?'<div class="cobrado">📲 Cobrado às '+esc(cob)+'</div>':'')+'<button class="cobrar" onclick="cobrar(this,\''+esc(d.unidade)+'\','+e.j.n+')">📲 Cobrar gerente</button>':'';
  if(e.est==='ok'){ const t=e.t; const app=Number(t.app)||0, ifd=Number(t.ifood)||0;
    return '<div class="tp ok"><span class="tp-n">'+e.j.n+'º · '+esc(e.j.label)+'</span><span class="tp-est">✓ Registrado'+(t.horario||t.hora?' '+esc(String(t.horario||t.hora).slice(0,5)):'')+'</span><span class="tp-val">App <span class="'+(app<=30?'num-ok':'num-ruim')+'">'+app+' min</span><br>iFood <span class="'+(ifd<=50?'num-ok':'num-ruim')+'">'+ifd+' min</span></span></div>'; }
  if(e.est==='aberto') return '<div class="tp aberto"><span class="tp-n">'+e.j.n+'º · '+esc(e.j.label)+'</span><span class="tp-est">⏳ Aberto</span><span class="tp-val">faltam '+e.falta+' min</span>'+botao+'</div>';
  if(e.est==='nao') return '<div class="tp nao"><span class="tp-n">'+e.j.n+'º · '+esc(e.j.label)+'</span><span class="tp-est">❌ Não feito</span>'+botao+'</div>';
  return '<div class="tp espera"><span class="tp-n">'+e.j.n+'º · '+esc(e.j.label)+'</span><span class="tp-est">Ainda não abriu</span></div>';
}
function renderLoja(d, json){
  const p=pendencias(d,json), ruim=p.includes('nao')||p.includes('aberto')||p.includes('falta');
  const tag=p.includes('nao')?'<span class="tag tag-pend">Tempo não feito</span>':p.includes('aberto')?'<span class="tag tag-aviso">Horário aberto</span>':p.includes('falta')?'<span class="tag tag-pend">Falta de produto</span>':p.includes('moto')?'<span class="tag tag-aviso">Motoboys</span>':'<span class="tag tag-ok">Em dia</span>';
  let h='<div class="loja-card '+(ruim?'pend':p.length?'atencao':'')+'"><div class="loja-topo"><span class="loja-nome">'+esc(d.unidade)+'</span>'+tag+'</div>';
  if(temEntrega(d)){
    h+='<div><div class="rot">🕐 Tempos de entrega</div><div class="tempos">'+estadoTempos(d,json).map(e=>renderTempo(e,d)).join('')+'</div></div>';
    h+='<div class="linha2"><div><div class="rot">Motoboys</div>'+renderMoto(d)+'</div><div><div class="rot">📦 Falta de produto</div>'+renderFalta(d)+'</div></div>';
  } else h+='<div><div class="rot">📦 Falta de produto</div>'+renderFalta(d)+'</div>';
  return h+'</div>';
}

async function cobrar(bt, unidade, registro){
  let quem=''; try{ quem=localStorage.getItem('cc_atendente')||''; }catch(e){}
  if(!quem){ quem=(prompt('Seu nome (fica registrado na cobrança):')||'').trim(); if(quem){ try{ localStorage.setItem('cc_atendente',quem); }catch(e){} } }
  bt.disabled=true; bt.textContent='Enviando...';
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'ccCobrar',unidade,registro,quem})});
    const j=await r.json();
    if(j.ok){ toast('✅ '+unidade+': '+(j.msg||'cobrança registrada.')); }
    else toast('⚠️ '+(j.erro||'Não foi possível cobrar agora.'));
  }catch(e){ toast('⚠️ Sem conexão com o servidor. Tente de novo.'); }
  setTimeout(carregarDados,800);
}

function tickCountdown(){
  segundosRestantes--;
  if(segundosRestantes<=0){ segundosRestantes=INTERVALO; carregarDados(); }
  document.getElementById('countdownTimer').textContent=Math.floor(segundosRestantes/60)+':'+String(segundosRestantes%60).padStart(2,'0');
  document.getElementById('countdownFill').style.width=(segundosRestantes/INTERVALO*100)+'%';
}
carregarDados();
setInterval(tickCountdown,1000);
</script>
<script src="atualizador.js?v=2"></script>
</body>
</html>
